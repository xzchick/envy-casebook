[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envy-casebook"
version = "0.1.0"
description = "ENVY Casebook: offline, encrypted, revision-preserving case notes in a native app window"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42,<47",
  "PyQt6>=6.7,<7",
]

[project.scripts]
envy-casebook = "envy_casebook.cli:main"

[project.gui-scripts]
envy-casebook-gui = "envy_casebook.cli:main"

[tool.setuptools.packages.find]
include = ["envy_casebook*"]
